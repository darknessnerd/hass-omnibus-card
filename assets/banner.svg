<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03a9f4"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="140" fill="#ffffff" opacity="0.08" filter="url(#soft)"/>
  <circle cx="120" cy="270" r="120" fill="#ffffff" opacity="0.06" filter="url(#soft)"/>

  <g transform="translate(120, 150)">
    <circle cx="0" cy="0" r="70" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-width="4"/>
    <g transform="translate(-30, -30)">
      <circle cx="0" cy="0" r="11" fill="#ffc107"/>
      <rect x="-3" y="10" width="6" height="7" rx="2" fill="#ffffff"/>
    </g>
    <g transform="translate(30, -30)">
      <rect x="-3" y="-11" width="6" height="18" rx="3" fill="#ff5252"/>
      <circle cx="0" cy="10" r="6" fill="#ff5252"/>
    </g>
    <g transform="translate(-30, 30)">
      <rect x="-11" y="-7" width="18" height="13" rx="2" fill="#ffffff"/>
      <path d="M7 -4 L15 -9 L15 9 L7 4 Z" fill="#ffffff"/>
    </g>
    <g transform="translate(30, 30)">
      <path d="M0 -13 L10 -7 L10 3 C10 9 6 12 0 14 C-6 12 -10 9 -10 3 L-10 -7 Z" fill="#4caf50"/>
      <path d="M-4 1 L-1 4 L5 -2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <text x="260" y="140" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Hass Omnibus Card
  </text>
  <text x="262" y="190" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#ffffff" opacity="0.85">
    One area. One card. Zero entity lists.
  </text>
  <g transform="translate(262, 220)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#ffffff" opacity="0.18"/>
    <text x="90" y="23" text-anchor="middle"
          font-family="'Segoe UI', Roboto, sans-serif" font-size="15"
          font-weight="600" fill="#ffffff" letter-spacing="1">
      HOME ASSISTANT · LOVELACE
    </text>
  </g>
</svg>
