  <style>
    /* ══════════════════════════════════════════════════════════════════
       HARNESS — neon-terminal console (development tool only)
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --bg:        #04070a;
      --panel:     rgba(6, 20, 14, 0.72);
      --line:      rgba(0, 255, 153, 0.16);
      --line-hi:   rgba(0, 255, 153, 0.42);
      --text:      #b8ffd6;
      --text-hi:   #e6fff1;
      --dim:       #4d8f74;
      --accent:    #00ff99;
      --err:       #ff3b6b;
      --glow:      0 0 6px rgba(0, 255, 153, 0.55), 0 0 18px rgba(0, 255, 153, 0.18);
      --glow-soft: 0 0 4px rgba(0, 255, 153, 0.35);
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --aside-w: 400px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
              radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,255,153,.09), transparent 60%),
              radial-gradient(ellipse 60% 40% at 50% 110%, rgba(0,255,153,.06), transparent 60%),
              var(--bg);
      color: var(--text);
      font: 13px/1.5 var(--mono);
      display: grid;
      grid-template-columns: var(--aside-w) 6px 1fr;
      height: 100vh; overflow: hidden;
      text-shadow: 0 0 2px rgba(0,255,153,.15);
    }
    ::selection { background: rgba(0,255,153,.28); color: var(--text-hi); }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,255,153,.18); border-radius: 4px;
      border: 2px solid transparent; background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,153,.35); background-clip: padding-box; }

    #splitter { background: transparent; cursor: col-resize; position: relative; z-index: 5; }
    #splitter::before {
      content: ''; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px;
      background: var(--line); transition: background .12s, box-shadow .12s;
    }
    #splitter:hover::before,
    body.dragging #splitter::before {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(0,255,153,.6);
    }
    body.dragging { cursor: col-resize; user-select: none; }
    body.dragging * { pointer-events: none; }
    body.dragging #splitter { pointer-events: auto; }

    aside {
      background:
              linear-gradient(180deg, rgba(0,255,153,.03), transparent 30%),
              var(--panel);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      border-right: 1px solid var(--line);
      box-shadow: inset -1px 0 0 rgba(0,255,153,.05), 0 0 40px rgba(0,255,153,.04);
      display: flex; flex-direction: column; overflow: hidden;
      min-width: 0;
      position: relative;
    }
    aside::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
              to bottom,
              rgba(0,255,153,.035) 0px,
              rgba(0,255,153,.035) 1px,
              transparent 1px,
              transparent 3px
      );
      mix-blend-mode: screen;
      z-index: 2;
    }
    aside > * { position: relative; z-index: 3; }

    aside header {
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      font-family: var(--mono); font-size: 11px;
      color: var(--accent);
      text-transform: uppercase; letter-spacing: .18em;
      flex-shrink: 0;
      text-shadow: var(--glow-soft);
    }
    aside header::before {
      content: '▶'; color: var(--accent);
      font-size: 9px; margin-right: 6px;
      animation: blink 1.4s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    aside header > span:first-child { margin-right: auto; }
    aside header a {
      color: var(--dim); text-decoration: none; letter-spacing: .1em;
      transition: color .12s, text-shadow .12s;
    }
    aside header a:hover { color: var(--accent); text-shadow: var(--glow); }

    #status-pill {
      font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
      padding: 2px 8px; border-radius: 3px;
      border: 1px solid var(--line);
      color: var(--dim); min-width: 64px; text-align: center;
      text-transform: uppercase;
      transition: color .15s, border-color .15s, box-shadow .15s;
    }
    #status-pill.ok {
      color: var(--accent);
      border-color: var(--line-hi);
      box-shadow: var(--glow-soft), inset 0 0 6px rgba(0,255,153,.15);
    }
    #status-pill.err {
      color: var(--err);
      border-color: rgba(255,59,107,.5);
      box-shadow: 0 0 6px rgba(255,59,107,.4);
    }

    .row {
      padding: 10px 16px; border-bottom: 1px solid var(--line);
      display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    }
    .row label {
      font-family: var(--mono); font-size: 10px; color: var(--dim);
      text-transform: uppercase; letter-spacing: .18em; flex: 0 0 68px;
    }
    .row label::after { content: ':' ; color: var(--dim); }

    select, input[type="text"] {
      flex: 1; min-width: 0;
      background: rgba(0, 20, 12, 0.7);
      color: var(--text-hi);
      border: 1px solid var(--line); border-radius: 3px;
      padding: 5px 8px; font: inherit; font-family: var(--mono); font-size: 12px;
      outline: none;
      transition: border-color .12s, box-shadow .12s;
      text-shadow: none;
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(0,255,153,.25), var(--glow-soft);
    }
    select option { background: #06100d; color: var(--text); }

    button {
      font: inherit; font-family: var(--mono); font-size: 11px;
      padding: 5px 10px;
      background: rgba(0, 255, 153, 0.04);
      color: var(--accent);
      border: 1px solid var(--line); border-radius: 3px;
      cursor: pointer; flex-shrink: 0;
      text-transform: uppercase; letter-spacing: .1em;
      text-shadow: var(--glow-soft);
      transition: background .12s, border-color .12s, box-shadow .12s, color .12s;
    }
    button:hover {
      background: rgba(0, 255, 153, 0.10);
      border-color: var(--line-hi);
      box-shadow: var(--glow-soft), inset 0 0 8px rgba(0,255,153,.12);
      color: var(--text-hi);
    }
    button:active { box-shadow: inset 0 0 12px rgba(0,255,153,.35); }

    .stack { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    .pane { display: flex; flex-direction: column; min-height: 60px; overflow: hidden; }
    .pane.editor-pane { flex: 0 0 var(--yaml-h, 220px); }
    .pane.state-pane  { flex: 1 1 auto; }
    .pane > textarea {
      flex: 1; width: 100%; min-height: 0;
      resize: none; border: none; outline: none;
      background: transparent;
      color: var(--text-hi); padding: 12px 16px;
      font-family: var(--mono); font-size: 12px; line-height: 1.65; tab-size: 2;
      caret-color: var(--accent);
      text-shadow: 0 0 3px rgba(0,255,153,.18);
    }
    .pane > textarea::placeholder { color: var(--dim); }
    .pane.state-pane > textarea {
      background:
              linear-gradient(180deg, rgba(0,255,153,.02), transparent 40%),
              rgba(0, 12, 8, 0.55);
    }

    .hsplitter { height: 5px; flex-shrink: 0; cursor: row-resize; position: relative; }
    .hsplitter::before {
      content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 1px;
      background: var(--line); transition: background .12s, box-shadow .12s;
    }
    .hsplitter:hover::before,
    body.dragging-h .hsplitter::before {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(0,255,153,.5);
    }
    body.dragging-h { cursor: row-resize; user-select: none; }
    body.dragging-h * { pointer-events: none; }
    body.dragging-h .hsplitter { pointer-events: auto; }

    #error {
      padding: 8px 16px;
      font-family: var(--mono); font-size: 11px;
      color: var(--err);
      border-top: 1px solid rgba(255,59,107,.25);
      background: rgba(255,59,107,.06);
      white-space: pre-wrap; display: none; flex-shrink: 0;
      text-shadow: 0 0 4px rgba(255,59,107,.4);
    }
    #error:not(:empty) { display: block; }
    #error:not(:empty)::before { content: '! '; color: var(--err); }

    /* ══════════════════════════════════════════════════════════════════
       STAGE — Home Assistant theme context
       Provides the exact CSS custom properties the card reads from its
       host, plus the official HA font stack and background colors.
       The card's own shadow-root CSS (ha-card, .chip, .badge, …) is
       untouched — everything below is host-side only.
       ══════════════════════════════════════════════════════════════════ */

    /* ── HA Light Theme (default) ─────────────────────────────────── */
    :root {
      /* Typography — official HA tokens */
      --ha-font-family-body: Roboto, Noto, sans-serif;
      --ha-font-size-scale: 1;
      --ha-font-size-xs: calc(10px * var(--ha-font-size-scale));
      --ha-font-size-s:  calc(12px * var(--ha-font-size-scale));
      --ha-font-size-m:  calc(14px * var(--ha-font-size-scale));
      --ha-font-size-l:  calc(16px * var(--ha-font-size-scale));
      --ha-font-size-xl: calc(20px * var(--ha-font-size-scale));
      --ha-font-weight-normal: 400;
      --ha-font-weight-medium: 500;
      --ha-font-weight-bold:   700;
      --ha-line-height-normal: 1.6;
      --ha-font-smoothing: antialiased;

      /* Core semantic colors */
      --primary-color: #03a9f4;
      --accent-color: #ff9800;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --disabled-text-color: #bdbdbd;
      --divider-color: rgba(0, 0, 0, 0.12);
      --error-color: #db4437;
      --warning-color: #ffa600;
      --success-color: #43a047;
      --info-color: #039be5;

      /* Surfaces */
      --card-background-color: #ffffff;
      --ha-card-background: #ffffff;
      --primary-background-color: #fafafa;
      --secondary-background-color: #e5e5e5;

      /* ha-card appearance — the card's internal CSS relies on these */
      --ha-card-border-radius: 12px;
      --ha-card-box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
      --ha-card-border-width: 0px;
      --ha-card-border-color: transparent;

      /* State / icon colors */
      --state-icon-color: #44739e;
      --state-icon-active-color: #fdd835;
      --state-icon-unavailable-color: #bdbdbd;

      --mdc-icon-size: 24px;

      color-scheme: light;
    }

    /* ── HA Dark Theme (follows browser preference) ───────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12);
        --error-color: #ef5350;
        --warning-color: #ffa726;
        --success-color: #66bb6a;
        --info-color: #42a5f5;

        --card-background-color: #1c1c1e;
        --ha-card-background: #1c1c1e;
        --primary-background-color: #111111;
        --secondary-background-color: #2c2c2e;

        --ha-card-box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);

        --state-icon-color: #6c8ba0;
        --state-icon-unavailable-color: #6f6f6f;

        color-scheme: dark;
      }
    }

    /* Stage background: HA primary background */
    main {
      overflow: auto; padding: 40px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 32px;
      min-width: 0;
      position: relative;
      background: var(--primary-background-color);
      font-family: var(--ha-font-family-body);
      color: var(--primary-text-color);
    }
    main::before { display: none; }
    main > * { position: relative; z-index: 1; }

    #cards {
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column; gap: 28px;
    }

    .slot { display: flex; flex-direction: column; gap: 8px; }
    .slot .slot-label {
      font-family: var(--mono); font-size: 10px;
      color: var(--secondary-text-color);
      text-transform: uppercase; letter-spacing: .18em;
    }
    .slot .slot-label::before { content: '// '; opacity: .5; }

    /* The card's internal CSS owns ha-card entirely (position, overflow,
       transitions, hover/active transforms). We only supply the CSS
       custom properties above; nothing here overrides the card's shadow
       styles. */
  </style>

  <script>
    customElements.define('ha-icon', class extends HTMLElement {
      static get observedAttributes() { return ['icon']; }
      connectedCallback() { this._sync(); }
      attributeChangedCallback() { this._sync(); }
      _sync() {
        const raw = this.getAttribute('icon') || '';
        this.innerHTML = `<iconify-icon icon="${raw}" style="font-size:inherit"></iconify-icon>`;
      }
    });
  </script>
</head>

      yaml: `area: cucina
history_chart:
  entity_id: binary_sensor.door_ground_floor_contact
  hours: 24`,
      callWS: () => Promise.resolve({ 'binary_sensor.door_ground_floor_contact': [] }),
    },

    'cucina-flat-history': {
      yaml: `area: cucina
history_chart:
  entity_id: sensor.ir_clima_cucina_temperature
  hours: 24
  y_min: 0`,
      callWS: (msg) => {
        if (msg.type !== 'history/history_during_period') return Promise.resolve({});
        const id = msg.entity_ids[0];
        const now = Date.now() / 1000;
        return Promise.resolve({ [id]: [{ s: '29.4', lu: now - 3600 }, { s: '29.4', lu: now }] });
      },
    },

    'esterno-camera-hidden': {
      yaml: `area: esterno
show_camera: false
max_entities: 20`,
    },

    'soggiorno-minimal': { yaml: `area: soggiorno` },
    'cameretta-minimal': { yaml: `area: cameretta` },

    'whitelist-only': {
      yaml: `# no area — whitelist mode. name/icon still optional.
entities:
  - sensor.ir_clima_cucina_temperature
  - sensor.ir_clima_cucina_humidity`,
    },

    'missing-area': { yaml: `area: nowhere` },

    'mold-warning': {
      yaml: `area: cucina
mold_threshold: 30`,
    },
  };

  /* ────────────────────────────────────────────────────────────────────────
     Discovery
     ──────────────────────────────────────────────────────────────────── */
  function discoverAreaEntities(areaId) {
    if (!areaId) return [];
    const ids = new Set();
    for (const [eid, entry] of Object.entries(BASE_HASS.entities)) {
      if (!entry.device_id) continue;
      const dev = BASE_HASS.devices[entry.device_id];
      if (dev?.area_id === areaId) ids.add(eid);
    }
    for (const [eid, entry] of Object.entries(BASE_HASS.entities)) {
      if (entry.area_id === areaId) ids.add(eid);
    }
    return [...ids].sort();
  }

  function resolveConfigEntities(config) {
    if (!config) return [];

    if (Array.isArray(config.entities) && config.entities.length) {
      return [...config.entities].sort();
    }

    const ids = new Set(discoverAreaEntities(config.area ?? null));
    if (Array.isArray(config.add_entities)) {
      for (const id of config.add_entities) ids.add(id);
    }
    if (Array.isArray(config.exclude_entities)) {
      for (const id of config.exclude_entities) ids.delete(id);
    }
    return [...ids].sort();
  }

  function currentStateSnapshot(config) {
    const ids = resolveConfigEntities(config);
    const snap = {};
    for (const id of ids) {
      const s = BASE_HASS.states[id];
      if (s) snap[id] = JSON.parse(JSON.stringify(s));
    }
    return snap;
  }

  /* ────────────────────────────────────────────────────────────────────────
     buildHass
     ──────────────────────────────────────────────────────────────────── */
  function isDarkTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function buildHass(overrides, callWSOverride) {
    const hass = JSON.parse(JSON.stringify(BASE_HASS));
    hass.callService = (d, s, data) => console.log('[callService]', d, s, data);
    hass.callWS = callWSOverride ?? ((msg) => {
      if (msg.type === 'history/history_during_period') {
        const id = msg.entity_ids[0];
        const now = Date.now() / 1000;
        const pts = Array.from({ length: 48 }, (_, i) => ({
          s: String((22 + Math.sin(i / 4) * 2 + Math.cos(i / 7)).toFixed(2)),
          lu: now - (48 - i) * 1800,
        }));
        return Promise.resolve({ [id]: pts });
      }
      return Promise.resolve({});
    });

    hass.locale = { language: 'it', number_format: 'comma_decimal', time_format: '24' };
    hass.config = { unit_system: { length: 'km', temperature: '°C' } };
    hass.themes = { darkMode: isDarkTheme() };
    hass.user = { name: 'dev', is_admin: true };

    for (const [id, patch] of Object.entries(overrides ?? {})) {
      hass.states[id] = { ...(hass.states[id] ?? {}), ...patch };
    }
    return hass;
  }

  /* ────────────────────────────────────────────────────────────────────────
     Mount
     ──────────────────────────────────────────────────────────────────── */
  const cardsEl = document.getElementById('cards');
  const mountedCards = [];

  function mountCard(config, overrides, callWSOverride, label) {
    if (!customElements.get('hass-omnibus-card')) {
      setTimeout(() => mountCard(config, overrides, callWSOverride, label), 30);
      return;
    }
    const slot = document.createElement('div');
    slot.className = 'slot';
    if (label) {
      const lbl = document.createElement('div');
      lbl.className = 'slot-label';
      lbl.textContent = label;
      slot.appendChild(lbl);
    }
    const card = document.createElement('hass-omnibus-card');
    slot.appendChild(card);
    cardsEl.appendChild(slot);
    try {
      card.setConfig(config);
      card.hass = buildHass(overrides, callWSOverride);
      mountedCards.push(card);
    } catch (e) {
      showError(e.message);
    }
  }

  function clearCards() {
    cardsEl.innerHTML = '';
    mountedCards.length = 0;
  }

  /* ────────────────────────────────────────────────────────────────────────
     Editor plumbing
     ──────────────────────────────────────────────────────────────────── */
  const yamlEl  = document.getElementById('yaml');
  const stateEl = document.getElementById('state-editor');
  const errorEl = document.getElementById('error');
  const pillEl  = document.getElementById('status-pill');

  function showError(msg) { errorEl.textContent = msg; setPill('error', 'err'); }
  function clearError()   { errorEl.textContent = ''; }

  let _pillTimer = null;
  function setPill(text, kind) {
    pillEl.textContent = text;
    pillEl.classList.remove('ok', 'err');
    if (kind) pillEl.classList.add(kind);
    clearTimeout(_pillTimer);
    if (kind) {
      _pillTimer = setTimeout(() => {
        pillEl.textContent = 'idle';
        pillEl.classList.remove('ok', 'err');
      }, 1200);
    }
  }

  function parseYaml() {
    const config = jsyaml.load(yamlEl.value) || {};
    if (typeof config !== 'object' || Array.isArray(config)) {
      throw new Error('config must be a YAML mapping');
    }
    return config;
  }

  function readStateEditor() {
    const raw = stateEl.value.trim();
    if (!raw) return {};
    return JSON.parse(raw);
  }

  function rerender() {
    clearError();
    let config, overrides;
    try { config = parseYaml(); }
    catch (e) { showError('yaml: ' + e.message); return false; }
    try { overrides = readStateEditor(); }
    catch (e) { showError('state: ' + e.message); return false; }

    clearCards();
    mountCard(config, overrides, currentFixture()?.callWS, null);
    setPill('applied', 'ok');
    return true;
  }

  let _applyTimer = null;
  function scheduleApply(delay = 250) {
    clearTimeout(_applyTimer);
    _applyTimer = setTimeout(() => rerender(), delay);
  }
  function flushApply() { clearTimeout(_applyTimer); rerender(); }

  yamlEl.addEventListener('input', () => scheduleApply());
  stateEl.addEventListener('input', () => scheduleApply());

  [yamlEl, stateEl].forEach(el => {
    el.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault(); flushApply();
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = el.selectionStart;
        el.value = el.value.slice(0, s) + '  ' + el.value.slice(s);
        el.selectionStart = el.selectionEnd = s + 2;
        scheduleApply();
      }
    });
  });

  /* ────────────────────────────────────────────────────────────────────────
     Fixture loading
     ──────────────────────────────────────────────────────────────────── */
  let _currentFixtureName = null;
  function currentFixture() { return FIXTURES[_currentFixtureName]; }

  function loadFixture(name) {
    _currentFixtureName = name;
    const fx = FIXTURES[name];
    if (!fx) return;

    yamlEl.value = fx.yaml;
    clearError();

    let config;
    try { config = jsyaml.load(fx.yaml) || {}; }
    catch (e) { showError(e.message); return; }

    const snapshot = currentStateSnapshot(config);
    const merged = { ...snapshot, ...(fx.state ?? {}) };
    stateEl.value = Object.keys(merged).length ? JSON.stringify(merged, null, 2) : '';

    flushApply();
    updateHash();
  }

  function resetStateEditor() {
    let config;
    try { config = parseYaml(); }
    catch (e) { showError(e.message); return; }
    const snapshot = currentStateSnapshot(config);
    stateEl.value = Object.keys(snapshot).length ? JSON.stringify(snapshot, null, 2) : '';
    flushApply();
  }

  function addCompare() {
    clearError();
    let config, edited;
    try {
      config = parseYaml();
      edited = readStateEditor();
    } catch (e) { showError(e.message); return; }

    const pristine = currentStateSnapshot(config);
    const fx = currentFixture();

    clearCards();
    mountCard(config, edited,   fx?.callWS, 'A — your edits');
    mountCard(config, pristine, fx?.callWS, 'B — current / pristine');
    setPill('compare', 'ok');
  }

  /* ────────────────────────────────────────────────────────────────────────
     Splitters
     ──────────────────────────────────────────────────────────────────── */
  (function initSplitter() {
    const splitter = document.getElementById('splitter');
    let startX = 0, startW = 0;
    function onMove(e) {
      const dx = e.clientX - startX;
      const next = Math.max(240, Math.min(window.innerWidth - 320, startW + dx));
      document.documentElement.style.setProperty('--aside-w', next + 'px');
      localStorage.setItem('pg-aside-w', String(next));
    }
    function onUp() {
      document.body.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    }
    splitter.addEventListener('mousedown', e => {
      e.preventDefault();
      startX = e.clientX;
      startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--aside-w'), 10) || 400;
      document.body.classList.add('dragging');
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
    const saved = parseInt(localStorage.getItem('pg-aside-w') || '', 10);
    if (saved) document.documentElement.style.setProperty('--aside-w', saved + 'px');
  })();

  (function initHSplitters() {
    const editorPane = document.querySelector('.pane.editor-pane');
    document.querySelectorAll('.hsplitter').forEach(sp => {
      let startY = 0, startH = 0;
      function onMove(e) {
        const dy = e.clientY - startY;
        const stack = editorPane.parentElement;
        const stackH = stack.clientHeight;
        const next = Math.max(80, Math.min(stackH - 120, startH + dy));
        editorPane.style.setProperty('--yaml-h', next + 'px');
        editorPane.style.flex = `0 0 ${next}px`;
      }
      function onUp() {
        document.body.classList.remove('dragging-h');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        const h = parseInt(editorPane.style.flex.match(/[\d.]+/)?.[0] || '220', 10);
        localStorage.setItem('pg-yaml-h', String(h));
      }
      sp.addEventListener('mousedown', e => {
        e.preventDefault();
        startY = e.clientY;
        startH = editorPane.getBoundingClientRect().height;
        document.body.classList.add('dragging-h');
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
    });
    const saved = parseInt(localStorage.getItem('pg-yaml-h') || '', 10);
    if (saved) {
      editorPane.style.flex = `0 0 ${saved}px`;
      editorPane.style.setProperty('--yaml-h', saved + 'px');
    }
  })();

  /* ────────────────────────────────────────────────────────────────────────
     URL
     ──────────────────────────────────────────────────────────────────── */
  function updateHash() {
    const p = new URLSearchParams();
    if (_currentFixtureName) p.set('fixture', _currentFixtureName);
    history.replaceState(null, '', '#' + p.toString());
  }

  function copyLink() {
    navigator.clipboard?.writeText(location.href).then(
            () => setPill('copied', 'ok'),
            () => setPill('blocked', 'err'),
    );
  }

  /* ────────────────────────────────────────────────────────────────────────
     Boot
     ──────────────────────────────────────────────────────────────────── */
  window.addEventListener('load', () => {
    const select = document.getElementById('fixture-select');
    for (const name of Object.keys(FIXTURES)) {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      select.appendChild(opt);
    }

    const params = new URLSearchParams(location.hash.replace(/^#/, ''));
    const initial = params.get('fixture') || 'cucina-baseline';
    select.value = initial;

    const t = setInterval(() => {
      if (customElements.get('hass-omnibus-card')) {
        clearInterval(t);
        loadFixture(initial);
      }
    }, 20);
  });
</script>

<script type="module" src="./src/index.js"></script>
