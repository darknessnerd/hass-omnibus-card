<!-- ── HA stub elements ──────────────────────────────────────────────────── -->
<script>
  // ha-card: styled container with slot
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() {
      Object.assign(this.style, {
        display: 'block',
        borderRadius: '12px',
        background: 'var(--ha-card-background, var(--card-background-color))',
        boxShadow: '0 2px 12px rgba(0,0,0,.25)',
        overflow: 'hidden',
        position: 'relative',
      });
    }
  });

  // ha-icon: delegate to iconify-icon
  customElements.define('ha-icon', class extends HTMLElement {
    static get observedAttributes() { return ['icon']; }
    connectedCallback() { this._sync(); }
    attributeChangedCallback() { this._sync(); }
    _sync() {
      const raw = this.getAttribute('icon') || '';
      // mdi:foo → iconify mdi:foo
      const iconName = raw.startsWith('mdi:') ? raw : raw.replace(':', ':');
      this.innerHTML = `<iconify-icon icon="${iconName}" style="font-size:inherit;--iconify-font-size:inherit"></iconify-icon>`;
    }
  });
</script>

// ── Scenario toggles ───────────────────────────────────────────────────────

const SCENARIOS = {
  normal: () => {
    MOCK_HASS.states['binary_sensor.smoke_det'].state = 'off';
    MOCK_HASS.states['binary_sensor.gas_det'].state = 'off';
    MOCK_HASS.states['binary_sensor.motion'].state = 'on';
    MOCK_HASS.states['sensor.bath_humidity'].state = '78';
    MOCK_HASS.states['light.ceiling'].state = 'on';
    MOCK_HASS.states['sensor.window_battery'].state = '78';
    MOCK_HASS.states['sensor.remote_battery'].state = '42';
  },
  alarm: () => {
    MOCK_HASS.states['binary_sensor.smoke_det'].state = 'on';
  },
  gas: () => {
    MOCK_HASS.states['binary_sensor.gas_det'].state = 'on';
  },
  no_motion: () => {
    MOCK_HASS.states['binary_sensor.motion'].state = 'off';
  },
  mold: () => {
    MOCK_HASS.states['sensor.bath_humidity'].state = '85';
  },
  lights_off: () => {
    MOCK_HASS.states['light.ceiling'].state = 'off';
  },
  light_offline: () => {
    MOCK_HASS.states['light.ceiling'].state = 'unavailable';
  },
  battery_low: () => {
    MOCK_HASS.states['sensor.remote_battery'].state = '4';
  },
};

function applyScenario(name) {
  SCENARIOS.normal();
  if (name !== 'normal') SCENARIOS[name]?.();
  refreshAll();
  log(`scenario: ${name}`);
}

function refreshAll() {
  // data-static cards have fixed state — skip them
  document.querySelectorAll('hass-omnibus-card:not([data-static])').forEach(el => {
    el.hass = { ...MOCK_HASS };
  });
}

function mountStatic(container, config, stateOverrides, callWSOverride) {
  const hass = JSON.parse(JSON.stringify(MOCK_HASS));
  hass.callService = MOCK_HASS.callService;
  hass.callWS      = callWSOverride ?? MOCK_HASS.callWS;
  hass.fireEvent   = MOCK_HASS.fireEvent;
  for (const [id, patch] of Object.entries(stateOverrides ?? {})) {
    hass.states[id] = { ...(hass.states[id] ?? {}), ...patch };
  }
  const el = document.createElement('hass-omnibus-card');
  el.setAttribute('data-static', '');
  el.setConfig(config);
  el.hass = hass;
  container.appendChild(el);
}
</script>

<div id="log"></div>

<script>
function log(...args) {
  const el = document.getElementById('log');
  el.textContent = `[${new Date().toLocaleTimeString()}] ${args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')}\n` + el.textContent;
}

// Intercept more-info events
window.addEventListener('hass-more-info', e => log('more-info:', e.detail?.entityId));
window.addEventListener('location-changed', e => log('navigate:', e.detail?.replace));

// Build cards after module loads
window.addEventListener('load', () => {
  setTimeout(() => {
    const CARDS = [
      { area: 'living_room' },
      { area: 'bedroom', mold_threshold: 60 },
      { area: 'kitchen' },
      { area: 'bathroom', mold_threshold: 65 },
      { area: 'cucina' },
      { area: 'nonexistent_area' },  // error state
    ];

    const container = document.getElementById('cards');
    CARDS.forEach(config => {
      const el = document.createElement('hass-omnibus-card');
      el.setConfig(config);
      el.hass = { ...MOCK_HASS };
      container.appendChild(el);
    });

    const HISTORY_CARDS = [
      { area: 'living_room', name: 'Default sparkline',   history_chart: { entity_id: 'sensor.temperature' } },
      { area: 'living_room', name: 'Custom color',        history_chart: { entity_id: 'sensor.temperature', color: 'rgba(255,152,0,0.18)' } },
      { area: 'bedroom',     name: '48h window',          history_chart: { entity_id: 'sensor.bed_temperature', hours: 48 } },
      // gradient: above 22 → red zone, below 19 → blue zone, middle → baseline
      { area: 'living_room', name: 'Gradient thresholds', history_chart: { entity_id: 'sensor.temperature', threshold_high: 22, threshold_low: 19 } },
      // single high threshold only
      { area: 'living_room', name: 'High threshold only', history_chart: { entity_id: 'sensor.temperature', threshold_high: 22 } },
      // y_min: 0 — scale floor pinned at 0, baseline never floats
      { area: 'living_room', name: 'y_min: 0',            history_chart: { entity_id: 'sensor.temperature', y_min: 0 } },
      // y_min + y_max — fixed scale 0–40
      { area: 'living_room', name: 'y_min: 0, y_max: 40', history_chart: { entity_id: 'sensor.temperature', y_min: 0, y_max: 40 } },
    ];

    const historyContainer = document.getElementById('history-cards');
    HISTORY_CARDS.forEach(config => {
      const el = document.createElement('hass-omnibus-card');
      el.setConfig(config);
      el.hass = { ...MOCK_HASS };
      historyContainer.appendChild(el);
    });

    // ── Flat history (new sensor — 2 identical points) ──────────────────────
    // Simulates real debug log: cucina / sensor.soggiornino_ths_temperature
    // callWS returns only 2 identical points, as HA would for a brand-new sensor

    const flatCallWS = msg => {
      if (msg.type === 'history/history_during_period') {
        const id = msg.entity_ids[0];
        // brand-new sensor: only 2 readings, both identical
        const pts = [{ s: '29.4', lu: Date.now() / 1000 - 3600 }, { s: '29.4', lu: Date.now() / 1000 }];
        log(`callWS flat history: ${id} → ${pts.length} points (identical)`);
        return Promise.resolve({ [id]: pts });
      }
      return Promise.resolve({});
    };

    const flatContainer = document.getElementById('flat-history-cards');

    // no y_min → guard triggers → sparkline hidden (correct: no meaningful shape)
    mountStatic(flatContainer, {
      area: 'cucina',
      name: 'Cucina — flat, no y_min (hidden)',
      history_chart: { entity_id: 'sensor.soggiornino_ths_temperature', hours: 48, color: 'rgba(255,200,100,0.15)', threshold_high: 27, color_high: 'rgba(244,67,54,0.18)' },
    }, {}, flatCallWS);

    // y_min: 0 → flat line renders at ~top (29.4 out of 0–29.4 scale)
    mountStatic(flatContainer, {
      area: 'cucina',
      name: 'Cucina — flat, y_min: 0 (shows line)',
      history_chart: { entity_id: 'sensor.soggiornino_ths_temperature', hours: 48, color: 'rgba(255,200,100,0.15)', threshold_high: 27, color_high: 'rgba(244,67,54,0.18)', y_min: 0 },
    }, {}, flatCallWS);

    // cucina normal area card (no history)
    mountStatic(flatContainer, { area: 'cucina', name: 'Cucina — area card' }, {});

    const FILTER_CARDS = [
      // exclude motion + TV from living room — no occupancy dot, fewer chips
      {
        area: 'living_room',
        name: 'Living Room (exclude)',
        exclude_entities: ['binary_sensor.motion', 'media_player.tv'],
      },
      // pin bedroom humidity into living room — humidity avg includes bed sensor
      {
        area: 'living_room',
        name: 'Living Room (add)',
        add_entities: ['sensor.bed_humidity'],
      },
      // whitelist: only temp + humidity, skip everything else in living room
      {
        area: 'living_room',
        name: 'Living Room (whitelist)',
        entities: ['sensor.temperature', 'sensor.humidity'],
      },
    ];

    const filterContainer = document.getElementById('filter-cards');
    FILTER_CARDS.forEach(config => {
      const el = document.createElement('hass-omnibus-card');
      el.setConfig(config);
      el.hass = { ...MOCK_HASS };
      filterContainer.appendChild(el);
    });

    // ── Feature gallery (static state, not changed by scenario buttons) ───
    const gallery = document.getElementById('gallery-cards');

    // Climate — heat mode with current temperature
    mountStatic(gallery, { area: 'living_room', name: 'Climate (heat)' }, {});

    // Alarm bar — add cross-area sensors via add_entities; override window as moisture
    mountStatic(gallery, {
      area: 'living_room', name: 'All alarms',
      add_entities: ['binary_sensor.smoke_det', 'binary_sensor.gas_det'],
    }, {
      'binary_sensor.smoke_det': { state: 'on', attributes: { friendly_name: 'Smoke', device_class: 'smoke' } },
      'binary_sensor.gas_det':   { state: 'on', attributes: { friendly_name: 'Gas',   device_class: 'gas' } },
      'binary_sensor.window':    { state: 'on', attributes: { friendly_name: 'Water', device_class: 'moisture' } },
    });

    // Problem badge — binary_sensor with device_class problem triggers the problems bucket
    mountStatic(gallery, { area: 'living_room', name: 'Problem badge' }, {
      'binary_sensor.window': { state: 'on', attributes: { friendly_name: 'Problem sensor', device_class: 'problem' } },
    });

    // Lights off — grey badge, no tint
    mountStatic(gallery, { area: 'living_room', name: 'Lights off (grey badge)' }, {
      'light.ceiling':    { state: 'off', attributes: { friendly_name: 'Ceiling' } },
      'light.floor_lamp': { state: 'off', attributes: { friendly_name: 'Floor Lamp' } },
    });

    // Light offline — orange dot on badge
    mountStatic(gallery, { area: 'living_room', name: 'Light offline (dot)' }, {
      'light.ceiling': { state: 'unavailable', attributes: { friendly_name: 'Ceiling' } },
    });

    // Battery badge — appears only when a battery sensor is at/below battery_low_threshold
    mountStatic(gallery, { area: 'living_room', name: 'Battery low (badge)' }, {
      'sensor.window_battery': { state: '78', attributes: { friendly_name: 'Window Sensor Battery', device_class: 'battery', unit_of_measurement: '%' } },
      'sensor.remote_battery': { state: '4',  attributes: { friendly_name: 'Remote Battery',        device_class: 'battery', unit_of_measurement: '%' } },
    });

    // Battery badge — hidden, all battery sensors above threshold
    mountStatic(gallery, { area: 'living_room', name: 'Battery ok (no badge)' }, {
      'sensor.window_battery': { state: '78', attributes: { friendly_name: 'Window Sensor Battery', device_class: 'battery', unit_of_measurement: '%' } },
      'sensor.remote_battery': { state: '42', attributes: { friendly_name: 'Remote Battery',        device_class: 'battery', unit_of_measurement: '%' } },
    });

    // Occupancy idle — grey dot
    mountStatic(gallery, { area: 'living_room', name: 'Not occupied (grey dot)' }, {
      'binary_sensor.motion': { state: 'off', attributes: { friendly_name: 'Motion', device_class: 'motion' } },
    });

    // Debug mode — check browser console for [hass-omnibus-card] update logs
